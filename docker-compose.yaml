
services:

  db:
    image: postgres
    container_name: db
    restart: always
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - ./dataset:/docker-entrypoint-initdb.d

  # adminer:
  #   image: adminer
  #   ports:
  #     - 8080:8080
  #   depends_on:
  #     - db

  flask:
    container_name: flask
    build: 
      context: ./app
      dockerfile: Dockerfile
    ports:
      - 8888:5000
    depends_on:
      - db